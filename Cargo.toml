[package]
name = "scraper-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
ollama-rs = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chromiumoxide = "0.7"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
anyhow = "1.0.104"
scraper = "0.27.0"
async-trait = "0.1.92"
env = "1.0.1"
schemars = "0.8"                                      # Enum/Struct 기반 JSON Schema 자동 생성
regex = "1.13.1"
