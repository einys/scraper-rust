[package]
name = "scraper-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
ollama-rs = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chromiumoxide = "0.7"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
anyhow = "1.0.104"
scraper = "0.27.0"
